<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zheng Digital Lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            min-height: 100vh;
            overflow-x: hidden;
            color: #ffffff;
        }

        /* Main Container */
        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000000 0%, #0a0a1a 50%, #000000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        /* Animated Background Grid */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 150, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 150, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        /* Glowing Orbs */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            animation: orb-float 8s ease-in-out infinite;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #0066ff, transparent);
            top: -250px;
            left: -250px;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #00d4ff, transparent);
            bottom: -200px;
            right: -200px;
            animation-delay: -4s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #0066ff, transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -2s;
        }

        @keyframes orb-float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 30px) scale(1.1); }
        }

        /* Particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #00d4ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff;
            animation: particle-float 10s linear infinite;
        }

        @keyframes particle-float {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                opacity: 0;
                transform: translateY(-100vh) scale(1);
            }
        }

        /* Robot Animation Container */
        .robot-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin-bottom: 40px;
            animation: robot-entrance 1.5s ease-out forwards;
            opacity: 0;
            transform: scale(0.5);
        }

        @keyframes robot-entrance {
            0% {
                opacity: 0;
                transform: scale(0.5) translateY(50px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Robot Head */
        .robot-head {
            position: absolute;
            width: 100px;
            height: 85px;
            background: linear-gradient(180deg, #1a1a2e, #0f0f1a);
            border: 2px solid rgba(0, 150, 255, 0.5);
            border-radius: 20px 20px 30px 30px;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 
                0 0 30px rgba(0, 150, 255, 0.3),
                inset 0 0 30px rgba(0, 150, 255, 0.1);
            animation: head-bob 2s ease-in-out infinite;
        }

        @keyframes head-bob {
            0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
            25% { transform: translateX(-50%) translateY(-5px) rotate(-2deg); }
            75% { transform: translateX(-50%) translateY(-5px) rotate(2deg); }
        }

        /* Robot Eyes */
        .robot-eyes {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 18px;
        }

        .robot-eye {
            width: 22px;
            height: 22px;
            background: #00d4ff;
            border-radius: 50%;
            box-shadow: 
                0 0 20px #00d4ff,
                0 0 40px #00d4ff,
                inset 0 0 10px rgba(255, 255, 255, 0.5);
            animation: eye-glow 1.5s ease-in-out infinite alternate;
            position: relative;
        }

        .robot-eye::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
            top: 4px;
            left: 4px;
            animation: eye-shine 2s ease-in-out infinite;
        }

        @keyframes eye-glow {
            0% { box-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff; }
            100% { box-shadow: 0 0 30px #00d4ff, 0 0 60px #00d4ff, 0 0 80px #00d4ff; }
        }

        @keyframes eye-shine {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Robot Antenna */
        .robot-antenna {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 25px;
            background: linear-gradient(180deg, #00d4ff, #0066ff);
            border-radius: 2px;
        }

        .robot-antenna::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: #00d4ff;
            border-radius: 50%;
            box-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff;
            animation: antenna-pulse 1s ease-in-out infinite;
        }

        @keyframes antenna-pulse {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
            50% { transform: translateX(-50%) scale(1.3); opacity: 0.7; }
        }

        /* Robot Body */
        .robot-body {
            position: absolute;
            width: 80px;
            height: 65px;
            background: linear-gradient(180deg, #1a1a2e, #0f0f1a);
            border: 2px solid rgba(0, 150, 255, 0.5);
            border-radius: 15px;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 
                0 0 30px rgba(0, 150, 255, 0.3),
                inset 0 0 30px rgba(0, 150, 255, 0.1);
        }

        /* Robot Chest Light */
        .robot-chest {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, rgba(0, 102, 255, 0.3), rgba(0, 212, 255, 0.3));
            border: 2px solid rgba(0, 212, 255, 0.5);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .robot-chest::before {
            content: '';
            width: 18px;
            height: 18px;
            background: #00d4ff;
            border-radius: 50%;
            animation: chest-pulse 2s ease-in-out infinite;
            box-shadow: 0 0 20px #00d4ff;
        }

        @keyframes chest-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.8); opacity: 0.5; }
        }

        /* Robot Arms */
        .robot-arm {
            position: absolute;
            width: 18px;
            height: 50px;
            background: linear-gradient(180deg, #1a1a2e, #0f0f1a);
            border: 2px solid rgba(0, 150, 255, 0.5);
            border-radius: 10px;
            top: 85px;
        }

        .robot-arm.left {
            left: 20px;
            transform-origin: top center;
            animation: arm-wave-left 2s ease-in-out infinite;
        }

        .robot-arm.right {
            right: 20px;
            transform-origin: top center;
            animation: arm-wave-right 2s ease-in-out infinite;
        }

        @keyframes arm-wave-left {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(-20deg); }
        }

        @keyframes arm-wave-right {
            0%, 100% { transform: rotate(10deg); }
            50% { transform: rotate(20deg); }
        }

        /* Logo */
        .logo-container {
            position: relative;
            margin-bottom: 25px;
            z-index: 10;
            animation: logo-entrance 1s ease-out 0.5s forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes logo-entrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            object-fit: cover;
            box-shadow: 0 0 40px rgba(0, 150, 255, 0.5);
            animation: logo-glow 3s ease-in-out infinite;
        }

        @keyframes logo-glow {
            0%, 100% { 
                filter: drop-shadow(0 0 20px rgba(0, 150, 255, 0.5));
                transform: scale(1);
            }
            50% { 
                filter: drop-shadow(0 0 40px rgba(0, 150, 255, 0.8));
                transform: scale(1.05);
            }
        }

        /* Company Name */
        .company-name {
            font-size: 2.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ffffff, #00d4ff, #ffffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: text-shimmer 3s linear infinite, name-entrance 1s ease-out 0.8s forwards;
            opacity: 0;
            transform: translateY(30px);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        @keyframes text-shimmer {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        @keyframes name-entrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Welcome Message */
        .welcome-message {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            max-width: 550px;
            padding: 0 20px;
            line-height: 1.8;
            margin-bottom: 35px;
            animation: message-entrance 1s ease-out 1.2s forwards;
            opacity: 0;
            transform: translateY(30px);
            position: relative;
            z-index: 10;
        }

        .welcome-message span {
            color: #00d4ff;
            font-weight: 600;
        }

        @keyframes message-entrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* CTA Container */
        .cta-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
            position: relative;
            z-index: 10;
            animation: cta-entrance 1s ease-out 1.6s forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes cta-entrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Instruction Text */
        .instruction-text {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 30px;
            background: rgba(0, 150, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 50px;
            margin-bottom: 10px;
            animation: instruction-pulse 2s ease-in-out infinite;
        }

        .instruction-icon {
            width: 24px;
            height: 24px;
            animation: home-bounce 1s ease-in-out infinite;
        }

        .instruction-icon svg {
            width: 100%;
            height: 100%;
            fill: #00d4ff;
        }

        @keyframes home-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.1); }
        }

        .instruction-label {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        @keyframes instruction-pulse {
            0%, 100% { 
                border-color: rgba(0, 212, 255, 0.3);
                box-shadow: 0 0 20px rgba(0, 150, 255, 0.1);
            }
            50% { 
                border-color: rgba(0, 212, 255, 0.6);
                box-shadow: 0 0 30px rgba(0, 150, 255, 0.2);
            }
        }

        /* CTA Buttons */
        .cta-buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cta-btn {
            position: relative;
            padding: 18px 40px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            border-radius: 60px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            border: none;
        }

        .cta-btn .btn-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cta-btn .btn-icon svg {
            width: 100%;
            height: 100%;
        }

        /* WhatsApp Button */
        .cta-whatsapp {
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: #ffffff;
            box-shadow: 0 10px 40px rgba(37, 211, 102, 0.4);
        }

        .cta-whatsapp::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .cta-whatsapp:hover::before {
            left: 100%;
        }

        .cta-whatsapp:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 50px rgba(37, 211, 102, 0.6);
        }

        .cta-whatsapp .btn-icon svg {
            fill: #ffffff;
        }

        /* Home Button */
        .cta-home {
            background: linear-gradient(135deg, #0066ff, #00d4ff);
            color: #ffffff;
            box-shadow: 0 10px 40px rgba(0, 150, 255, 0.4);
        }

        .cta-home::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
            border-radius: 60px;
        }

        .cta-home:hover::before {
            left: 100%;
        }

        .cta-home:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 50px rgba(0, 150, 255, 0.6);
        }

        .cta-home .btn-icon svg {
            fill: #ffffff;
        }

        /* Hexagon Decorations */
        .hexagon {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid rgba(0, 150, 255, 0.2);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            animation: hexagon-rotate 20s linear infinite;
        }

        .hexagon:nth-child(1) { top: 10%; left: 5%; }
        .hexagon:nth-child(2) { top: 60%; left: 8%; width: 60px; height: 60px; animation-delay: -5s; animation-direction: reverse; }
        .hexagon:nth-child(3) { top: 20%; right: 8%; width: 80px; height: 80px; animation-delay: -10s; }
        .hexagon:nth-child(4) { bottom: 15%; right: 5%; animation-delay: -15s; }

        @keyframes hexagon-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Data Stream */
        .data-stream {
            position: absolute;
            width: 2px;
            height: 100%;
            top: 0;
            overflow: hidden;
        }

        .data-stream::before {
            content: '01010110 11001010 10101010 01010101 11001100 00110011';
            position: absolute;
            width: 200px;
            font-family: monospace;
            font-size: 10px;
            color: rgba(0, 212, 255, 0.3);
            writing-mode: vertical-rl;
            animation: stream-flow 15s linear infinite;
        }

        .data-stream:nth-child(1) { left: 10%; }
        .data-stream:nth-child(2) { left: 30%; animation-delay: -5s; }
        .data-stream:nth-child(3) { right: 20%; animation-delay: -10s; }
        .data-stream:nth-child(4) { right: 5%; animation-delay: -3s; }

        @keyframes stream-flow {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        /* Scan Line Effect */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.5), transparent);
            animation: scan 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Circuit Lines Animation */
        .circuit-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .circuit-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, #00d4ff, transparent);
            height: 2px;
            animation: circuit-flow 3s linear infinite;
        }

        @keyframes circuit-flow {
            0% { transform: translateX(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(100vw); opacity: 0; }
        }

        /* Pulse Ring Effect */
        .pulse-ring {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 50%;
            animation: ring-pulse 3s ease-out infinite;
        }

        .pulse-ring:nth-child(1) { animation-delay: 0s; }
        .pulse-ring:nth-child(2) { animation-delay: 1s; }
        .pulse-ring:nth-child(3) { animation-delay: 2s; }

        @keyframes ring-pulse {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .company-name { font-size: 1.6rem; letter-spacing: 3px; }
            .welcome-message { font-size: 1rem; padding: 0 20px; }
            .robot-container { transform: scale(0.7); margin-bottom: 20px; }
            .logo { width: 70px; height: 70px; }
            .instruction-text { padding: 12px 20px; flex-direction: column; gap: 8px; text-align: center; }
            .instruction-label { font-size: 0.85rem; }
            .cta-buttons { flex-direction: column; width: 100%; padding: 0 30px; }
            .cta-btn { width: 100%; justify-content: center; padding: 16px 35px; font-size: 0.95rem; }
            .hexagon { display: none; }
        }
    </style>
</head>

        <div class="bg-grid"></div>
        <div class="glow-orb orb-1"></div>

        <!-- Data Streams -->
        <div class="data-stream"></div>
        <div class="data-stream"></div>

        <!-- Hexagon Decorations -->
        <div class="hexagon"></div>

        <!-- Circuit Lines -->

        <!-- Robot Animation -->

        <p class="welcome-message">

        <!-- CTA Buttons -->
        <div class="cta-container">

            <div class="instruction-text">

                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>

            </div>
            
            <div class="cta-buttons">

    <script>
        // Create Particles
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 40;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (Math.random() * 8 + 8) + 's';
                const size = Math.random() * 4 + 1;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                container.appendChild(particle);
            }
        }

        // Create Circuit Lines
        function createCircuitLines() {
            const container = document.getElementById('circuitLines');
            const lineCount = 8;
            for (let i = 0; i < lineCount; i++) {
                const line = document.createElement('div');
                line.className = 'circuit-line';
                line.style.top = (Math.random() * 100) + '%';
                line.style.width = (Math.random() * 200 + 100) + 'px';
                line.style.animationDelay = (Math.random() * 3) + 's';
                line.style.animationDuration = (Math.random() * 2 + 2) + 's';
                container.appendChild(line);
            }
        }

        // Mouse tracking for glow effect
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            document.querySelectorAll('.glow-orb').forEach((orb, index) => {
                const speed = (index + 1) * 10;
                orb.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });

        // Initialize
        createParticles();
        createCircuitLines();
    </script>
