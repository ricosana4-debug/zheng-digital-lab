<!DOCTYPE html>  <html lang="id">    <head>      <meta charset="UTF-8">      
<meta name="viewport" content="width=device-width, initial-scale=1.0">      
<title>Zheng Digital Lab | System Boot</title>      
<style>      
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap');  * { margin: 0; padding: 0; box-sizing: border-box; }    :root {      
--neon-cyan: #00f0ff;      
--neon-pink: #ff00ff;      
--neon-blue: #0066ff;      
--dark-bg: #050508;      
--grid-color: rgba(0, 240, 255, 0.1);

}

body {
font-family: 'Orbitron', sans-serif;
background: var(--dark-bg);
min-height: 100vh;
overflow: hidden;
color: #fff;
position: relative;
}

/* CRT Scanline Effect */
.crt::before {
content: " ";
display: block;
position: absolute;
top: 0; left: 0; bottom: 0; right: 0;
background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
background-size: 100% 2px, 3px 100%;
pointer-events: none;
z-index: 1000;
animation: flicker 0.15s infinite;
}

@keyframes flicker {
0% { opacity: 0.97; }
50% { opacity: 1; }
100% { opacity: 0.98; }
}

/* Animated Grid Floor */
.grid-floor {
position: absolute;
bottom: 0;
left: -50%;
width: 200%;
height: 60%;
background-image:
linear-gradient(var(--grid-color) 1px, transparent 1px),
linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
background-size: 50px 50px;
transform: perspective(500px) rotateX(60deg);
animation: grid-move 2s linear infinite;
opacity: 0.3;
pointer-events: none;
}

@keyframes grid-move {
0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
}

/* Floating Particles - Data Rain */
.data-rain {
position: absolute;
top: 0; left: 0;
width: 100%; height: 100%;
overflow: hidden;
pointer-events: none;
z-index: 1;
}

.data-drop {
position: absolute;
font-family: 'Share Tech Mono', monospace;
font-size: 14px;
color: rgba(0, 240, 255, 0.4);
animation: fall linear infinite;
text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
}

@keyframes fall {
0% { transform: translateY(-100vh); opacity: 0; }
10% { opacity: 1; }
90% { opacity: 0.4; }
100% { transform: translateY(100vh); opacity: 0; }
}

/* Main Container */
.boot-screen {
position: relative;
width: 100%; height: 100vh;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
z-index: 10;
}

/* System Boot Text */
.boot-sequence {
position: absolute;
top: 40px; left: 40px;
font-family: 'Share Tech Mono', monospace;
font-size: 12px;
color: rgba(0, 240, 255, 0.6);
line-height: 1.8;
}

.boot-line {
opacity: 0;
animation: boot-type 0.1s forwards;
}

/* Central Hologram Display */
.hologram-container {
position: relative;
width: 300px; height: 300px;
margin-bottom: 40px;
}

.hologram-ring {
position: absolute;
border: 2px solid var(--neon-cyan);
border-radius: 50%;
box-shadow: 0 0 20px var(--neon-cyan), inset 0 0 20px rgba(0, 240, 255, 0.2);
animation: hologram-spin 4s linear infinite;
}

.hologram-ring:nth-child(1) { width: 100%; height: 100%; animation-duration: 8s; border-color: var(--neon-cyan); }
.hologram-ring:nth-child(2) { width: 80%; height: 80%; top: 10%; left: 10%; animation-duration: 6s; animation-direction: reverse; border-color: var(--neon-pink); box-shadow: 0 0 20px var(--neon-pink), inset 0 0 20px rgba(255, 0, 255, 0.2); }
.hologram-ring:nth-child(3) { width: 60%; height: 60%; top: 20%; left: 20%; animation-duration: 4s; border-color: var(--neon-blue); box-shadow: 0 0 20px var(--neon-blue), inset 0 0 20px rgba(0, 102, 255, 0.2); }

@keyframes hologram-spin {
0% { transform: rotate(0deg) rotateX(70deg); }
100% { transform: rotate(360deg) rotateX(70deg); }
}

/* Logo in Center */
.core-logo {
position: absolute;
top: 50%; left: 50%;
transform: translate(-50%, -50%);
width: 100px; height: 100px;
border-radius: 50%;
object-fit: cover;
border: 3px solid var(--neon-cyan);
box-shadow: 0 0 40px var(--neon-cyan), 0 0 80px var(--neon-cyan);
animation: core-pulse 2s ease-in-out infinite;
z-index: 10;
}

@keyframes core-pulse {
0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 40px var(--neon-cyan), 0 0 80px var(--neon-cyan); }
50% { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 60px var(--neon-cyan), 0 0 120px var(--neon-cyan); }
}

/* Glitch Text Effect */
.glitch-text {
font-size: 3.5rem;
font-weight: 900;
letter-spacing: 8px;
position: relative;
color: #fff;
text-shadow: 0 0 20px var(--neon-cyan);
animation: glitch-skew 3s infinite;
}

.glitch-text::before,
.glitch-text::after {
content: attr(data-text);
position: absolute;
top: 0; left: 0;
width: 100%; height: 100%;
}

.glitch-text::before {
left: 2px;
text-shadow: -2px 0 var(--neon-pink);
clip: rect(24px, 550px, 90px, 0);
animation: glitch-anim-1 2s infinite linear alternate-reverse;
}

.glitch-text::after {
left: -2px;
text-shadow: -2px 0 var(--neon-blue);
clip: rect(85px, 550px, 140px, 0);
animation: glitch-anim-2 2s infinite linear alternate-reverse;
}

@keyframes glitch-anim-1 {
0% { clip: rect(20px, 9999px, 50px, 0); }
20% { clip: rect(80px, 9999px, 120px, 0); }
40% { clip: rect(10px, 9999px, 60px, 0); }
60% { clip: rect(90px, 9999px, 130px, 0); }
80% { clip: rect(40px, 9999px, 80px, 0); }
100% { clip: rect(70px, 9999px, 110px, 0); }
}

@keyframes glitch-anim-2 {
0% { clip: rect(60px, 9999px, 100px, 0); }
20% { clip: rect(10px, 9999px, 50px, 0); }
40% { clip: rect(100px, 9999px, 140px, 0); }
60% { clip: rect(30px, 9999px, 70px, 0); }
80% { clip: rect(120px, 9999px, 160px, 0); }
100% { clip: rect(50px, 9999px, 90px, 0); }
}

@keyframes glitch-skew {
0%, 100% { transform: skew(0deg); }
20% { transform: skew(-2deg); }
40% { transform: skew(2deg); }
60% { transform: skew(-1deg); }
80% { transform: skew(1deg); }
}

/* Typing Subtitle */
.typing-text {
font-family: 'Share Tech Mono', monospace;
font-size: 1.2rem;
color: var(--neon-cyan);
margin: 20px 0 40px;
border-right: 2px solid var(--neon-cyan);
white-space: nowrap;
overflow: hidden;
animation: typing 3s steps(40) forwards, blink-caret 0.75s step-end infinite;
max-width: 0;
}

@keyframes typing {
to { max-width: 100%; }
}

@keyframes blink-caret {
50% { border-color: transparent; }
}

/* Futuristic Buttons */
.cyber-btn {
position: relative;
padding: 18px 50px;
background: transparent;
border: 2px solid var(--neon-cyan);
color: var(--neon-cyan);
font-family: 'Orbitron', sans-serif;
font-size: 1rem;
font-weight: 600;
letter-spacing: 4px;
text-transform: uppercase;
cursor: pointer;
overflow: hidden;
transition: all 0.3s;
clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
margin: 10px;
text-decoration: none;
display: inline-flex;
align-items: center;
gap: 15px;
}

.cyber-btn::before {
content: '';
position: absolute;
top: 0; left: -100%;
width: 100%; height: 100%;
background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.4), transparent);
transition: left 0.5s;
}

.cyber-btn:hover::before {
left: 100%;
}

.cyber-btn:hover {
background: rgba(0, 240, 255, 0.1);
box-shadow: 0 0 30px var(--neon-cyan), inset 0 0 20px rgba(0, 240, 255, 0.2);
text-shadow: 0 0 10px var(--neon-cyan);
transform: translateY(-2px);
}

.cyber-btn.primary {
background: var(--neon-cyan);
color: #000;
box-shadow: 0 0 30px var(--neon-cyan);
}

.cyber-btn.primary:hover {
background: #fff;
box-shadow: 0 0 50px var(--neon-cyan), 0 0 100px var(--neon-cyan);
}

/* Decorative Elements */
.corner-deco {
position: absolute;
width: 100px; height: 100px;
border: 2px solid var(--neon-cyan);
opacity: 0.5;
}

.corner-deco::before {
content: '';
position: absolute;
width: 20px; height: 20px;
background: var(--neon-cyan);
box-shadow: 0 0 20px var(--neon-cyan);
}

.corner-tl { top: 30px; left: 30px; border-right: 0; border-bottom: 0; }
.corner-tl::before { top: -2px; left: -2px; }
.corner-tr { top: 30px; right: 30px; border-left: 0; border-bottom: 0; }
.corner-tr::before { top: -2px; right: -2px; }
.corner-bl { bottom: 30px; left: 30px; border-right: 0; border-top: 0; }
.corner-bl::before { bottom: -2px; left: -2px; }
.corner-br { bottom: 30px; right: 30px; border-left: 0; border-top: 0; }
.corner-br::before { bottom: -2px; right: -2px; }

/* Responsive */
@media (max-width: 768px) {
.glitch-text { font-size: 2rem; letter-spacing: 4px; }
.hologram-container { width: 200px; height: 200px; }
.core-logo { width: 70px; height: 70px; }
.typing-text { font-size: 0.9rem; white-space: normal; border: none; animation: none; max-width: 100%; }
.cyber-btn { padding: 15px 30px; font-size: 0.85rem; letter-spacing: 2px; }
.boot-sequence { display: none; }
}

</style>  </head>
