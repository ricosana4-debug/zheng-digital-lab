<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zheng Digital Lab | System Boot</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --neon-cyan: #00f0ff;
    --neon-pink: #ff00ff;
    --neon-blue: #0066ff;
    --dark-bg: #050508;
    --grid-color: rgba(0, 240, 255, 0.1);
}

body {
    font-family: 'Orbitron', sans-serif;
    background: var(--dark-bg);
    min-height: 100vh;
    overflow: hidden;
    color: #fff;
    position: relative;
}

/* CRT Scanline Effect */
.crt::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background:
        linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%),
        linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));
    background-size: 100% 2px, 3px 100%;
    pointer-events: none;
    z-index: 1000;
    animation: flicker 0.15s infinite;
}

@keyframes flicker {
    0% { opacity: 0.97; }
    50% { opacity: 1; }
    100% { opacity: 0.98; }
}

/* Grid Floor */
.grid-floor {
    position: absolute;
    bottom: 0;
    left: -50%;
    width: 200%;
    height: 60%;
    background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 50px 50px;
    transform: perspective(500px) rotateX(60deg);
    animation: grid-move 2s linear infinite;
    opacity: 0.3;
    pointer-events: none;
}

@keyframes grid-move {
    0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
    100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
}

/* Data Rain */
.data-rain {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
}

.data-drop {
    position: absolute;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    color: rgba(0,240,255,0.4);
    animation: fall linear infinite;
    text-shadow: 0 0 10px rgba(0,240,255,0.5);
}

@keyframes fall {
    0% { transform: translateY(-100vh); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.4; }
    100% { transform: translateY(100vh); opacity: 0; }
}

/* Boot Screen */
.boot-screen {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
}

.glitch-text {
    font-size: 3.5rem;
    font-weight: 900;
    letter-spacing: 8px;
    position: relative;
    color: #fff;
    text-shadow: 0 0 20px var(--neon-cyan);
    animation: glitch-skew 3s infinite;
}

@keyframes glitch-skew {
    0%,100% { transform: skew(0deg); }
    20% { transform: skew(-2deg); }
    40% { transform: skew(2deg); }
    60% { transform: skew(-1deg); }
    80% { transform: skew(1deg); }
}

.cyber-btn {
    padding: 18px 50px;
    background: transparent;
    border: 2px solid var(--neon-cyan);
    color: var(--neon-cyan);
    font-family: 'Orbitron', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    transition: 0.3s;
    text-decoration: none;
    margin: 10px;
}

.cyber-btn:hover {
    background: rgba(0,240,255,0.1);
    box-shadow: 0 0 30px var(--neon-cyan);
}
</style>
</head>
<body class="crt">

<div class="grid-floor"></div>
<div class="data-rain" id="dataRain"></div>

<div class="boot-screen">
    <h1 class="glitch-text">ZHENG DIGITAL LAB</h1>
    <a href="home.html" class="cyber-btn">ENTER SYSTEM</a>
</div>

<script>
const chars = '01アイウエオカキクケコサシスセソタチツテト';
const dataRain = document.getElementById('dataRain');

for (let i = 0; i < 30; i++) {
    const drop = document.createElement('div');
    drop.className = 'data-drop';
    drop.textContent = chars[Math.floor(Math.random() * chars.length)];
    drop.style.left = Math.random() * 100 + '%';
    drop.style.animationDuration = (Math.random() * 3 + 2) + 's';
    dataRain.appendChild(drop);
}
</script>

</body>
</html>
