<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zheng Digital Lab | System Boot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap');
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        :root {
            --primary: #0ea5e9;
            --primary-glow: rgba(14, 165, 233, 0.4);
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.3);
            --dark-bg: #0a0a0f;
            --darker: #050508;
            --surface: rgba(15, 23, 42, 0.6);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --grid-color: rgba(14, 165, 233, 0.08);
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background: var(--dark-bg);
            min-height: 100vh;
            overflow: hidden;
            color: var(--text-primary);
            position: relative;
        }

        /* Subtle Gradient Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(14, 165, 233, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(245, 158, 11, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(99, 102, 241, 0.03) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Refined CRT Effect */
        .crt::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.15) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.4;
        }

        /* Smooth Grid Floor */
        .grid-floor {
            position: absolute;
            bottom: -20%;
            left: -50%;
            width: 200%;
            height: 70%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 80px 80px;
            transform: perspective(800px) rotateX(75deg);
            animation: grid-move 15s linear infinite;
            opacity: 0.4;
            pointer-events: none;
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, transparent 100%);
        }

        @keyframes grid-move {
            0% { transform: perspective(800px) rotateX(75deg) translateY(0); }
            100% { transform: perspective(800px) rotateX(75deg) translateY(80px); }
        }

        /* Elegant Data Particles */
        .data-particles {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0;
            animation: float-up 12s ease-in-out infinite;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .particle::after {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 20px;
            background: linear-gradient(to top, var(--primary), transparent);
            opacity: 0.5;
        }

        @keyframes float-up {
            0% { 
                transform: translateY(100vh) scale(0); 
                opacity: 0; 
            }
            10% { 
                opacity: 0.6; 
                transform: translateY(90vh) scale(1);
            }
            90% { 
                opacity: 0.6;
                transform: translateY(10vh) scale(1);
            }
            100% { 
                transform: translateY(-10vh) scale(0); 
                opacity: 0; 
            }
        }

        /* Main Container */
        .boot-screen {
            position: relative;
            width: 100%; height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* Boot Sequence - Refined */
        .boot-sequence {
            position: absolute;
            top: 50px; left: 50px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 2;
            letter-spacing: 1px;
        }

        .boot-line {
            opacity: 0;
            animation: fade-in 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .boot-line::before {
            content: '>';
            color: var(--primary);
            margin-right: 8px;
        }

        @keyframes fade-in {
            to { opacity: 1; }
        }

        /* Hologram Display - Premium */
        .hologram-container {
            position: relative;
            width: 280px; height: 280px;
            margin-bottom: 50px;
        }

        .hologram-ring {
            position: absolute;
            border: 1px solid;
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        .hologram-ring:nth-child(1) { 
            width: 100%; height: 100%;
            border-color: rgba(14, 165, 233, 0.3);
            animation: ring-pulse-1 4s ease-in-out infinite;
        }

        .hologram-ring:nth-child(2) { 
            width: 75%; height: 75%;
            border-color: rgba(245, 158, 11, 0.25);
            animation: ring-pulse-2 4s ease-in-out infinite 0.5s;
        }

        .hologram-ring:nth-child(3) { 
            width: 50%; height: 50%;
            border-color: rgba(99, 102, 241, 0.2);
            animation: ring-pulse-3 4s ease-in-out infinite 1s;
        }

        @keyframes ring-pulse-1 {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1) rotateX(70deg);
                border-color: rgba(14, 165, 233, 0.2);
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.05) rotateX(70deg);
                border-color: rgba(14, 165, 233, 0.4);
            }
        }

        @keyframes ring-pulse-2 {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1) rotateX(70deg);
                border-color: rgba(245, 158, 11, 0.15);
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.08) rotateX(70deg);
                border-color: rgba(245, 158, 11, 0.35);
            }
        }

        @keyframes ring-pulse-3 {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1) rotateX(70deg);
                border-color: rgba(99, 102, 241, 0.1);
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.1) rotateX(70deg);
                border-color: rgba(99, 102, 241, 0.3);
            }
        }

        /* Inner rotating ring */
        .hologram-ring-inner {
            position: absolute;
            width: 85%; height: 85%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 1px dashed rgba(14, 165, 233, 0.15);
            border-radius: 50%;
            animation: ring-rotate 20s linear infinite;
        }

        @keyframes ring-rotate {
            from { transform: translate(-50%, -50%) rotate(0deg) rotateX(70deg); }
            to { transform: translate(-50%, -50%) rotate(360deg) rotateX(70deg); }
        }

        /* Logo - Premium Glow */
        .core-logo {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90px; height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(14, 165, 233, 0.5);
            box-shadow: 
                0 0 30px rgba(14, 165, 233, 0.3),
                inset 0 0 30px rgba(14, 165, 233, 0.1);
            animation: logo-breathe 4s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes logo-breathe {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 
                    0 0 30px rgba(14, 165, 233, 0.3),
                    inset 0 0 30px rgba(14, 165, 233, 0.1);
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.03);
                box-shadow: 
                    0 0 50px rgba(14, 165, 233, 0.5),
                    inset 0 0 40px rgba(14, 165, 233, 0.15);
            }
        }

        /* Refined Glitch Text */
        .glitch-text {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 12px;
            position: relative;
            color: var(--text-primary);
            text-transform: uppercase;
            animation: subtle-glitch 8s ease-in-out infinite;
        }

        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0.8;
        }

        .glitch-text::before {
            color: var(--primary);
            animation: glitch-1 4s ease-in-out infinite;
            clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
        }

        .glitch-text::after {
            color: var(--accent);
            animation: glitch-2 4s ease-in-out infinite 0.5s;
            clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
        }

        @keyframes glitch-1 {
            0%, 90%, 100% { transform: translate(0); opacity: 0; }
            92% { transform: translate(-3px, 1px); opacity: 0.6; }
            94% { transform: translate(2px, -1px); opacity: 0.6; }
            96% { transform: translate(0); opacity: 0; }
        }

        @keyframes glitch-2 {
            0%, 85%, 100% { transform: translate(0); opacity: 0; }
            87% { transform: translate(3px, -1px); opacity: 0.5; }
            89% { transform: translate(-2px, 1px); opacity: 0.5; }
            91% { transform: translate(0); opacity: 0; }
        }

        @keyframes subtle-glitch {
            0%, 95%, 100% { transform: skew(0deg); }
            96% { transform: skew(-0.5deg); }
            97% { transform: skew(0.5deg); }
            98% { transform: skew(0deg); }
        }

        /* Subtitle with glow */
        .subtitle {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            color: var(--text-secondary);
            margin: 25px 0 50px;
            letter-spacing: 4px;
            position: relative;
        }

        .subtitle::after {
            content: '';
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--primary);
            margin-left: 5px;
            animation: cursor-blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes cursor-blink {
            50% { opacity: 0; }
        }

        /* Premium Buttons */
        .button-group {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cyber-btn {
            position: relative;
            padding: 16px 45px;
            background: transparent;
            border: 1px solid rgba(14, 165, 233, 0.4);
            color: var(--text-primary);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            border-radius: 4px;
        }

        .cyber-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(14, 165, 233, 0.2), 
                transparent
            );
            transition: left 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cyber-btn:hover::before {
            left: 100%;
        }

        .cyber-btn:hover {
            border-color: var(--primary);
            background: rgba(14, 165, 233, 0.08);
            box-shadow: 
                0 0 30px rgba(14, 165, 233, 0.2),
                inset 0 0 20px rgba(14, 165, 233, 0.05);
            transform: translateY(-2px);
        }

        .cyber-btn.primary {
            background: linear-gradient(135deg, var(--primary), #0284c7);
            border-color: transparent;
            color: white;
        }

        .cyber-btn.primary:hover {
            background: linear-gradient(135deg, #38bdf8, var(--primary));
            box-shadow: 
                0 10px 40px rgba(14, 165, 233, 0.4),
                0 0 60px rgba(14, 165, 233, 0.2);
            transform: translateY(-3px);
        }

        .cyber-btn .icon {
            font-size: 1.1rem;
            transition: transform 0.3s ease;
        }

        .cyber-btn:hover .icon {
            transform: scale(1.1);
        }

        /* Refined Corner Decorations */
        .corner-deco {
            position: absolute;
            width: 60px; height: 60px;
            pointer-events: none;
        }

        .corner-deco::before,
        .corner-deco::after {
            content: '';
            position: absolute;
            background: linear-gradient(135deg, var(--primary), transparent);
        }

        .corner-tl { 
            top: 40px; left: 40px; 
        }
        .corner-tl::before {
            top: 0; left: 0;
            width: 2px; height: 100%;
        }
        .corner-tl::after {
            top: 0; left: 0;
            width: 100%; height: 2px;
        }

        .corner-tr { 
            top: 40px; right: 40px;
            transform: rotate(90deg);
        }
        .corner-tr::before {
            top: 0; left: 0;
            width: 2px; height: 100%;
        }
        .corner-tr::after {
            top: 0; left: 0;
            width: 100%; height: 2px;
        }

        .corner-bl { 
            bottom: 40px; left: 40px;
            transform: rotate(-90deg);
        }
        .corner-bl::before {
            top: 0; left: 0;
            width: 2px; height: 100%;
        }
        .corner-bl::after {
            top: 0; left: 0;
            width: 100%; height: 2px;
        }

        .corner-br { 
            bottom: 40px; right: 40px;
            transform: rotate(180deg);
        }
        .corner-br::before {
            top: 0; left: 0;
            width: 2px; height: 100%;
        }
        .corner-br::after {
            top: 0; left: 0;
            width: 100%; height: 2px;
        }

        /* Status Bar */
        .status-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 2px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; box-shadow: 0 0 5px var(--accent); }
            50% { opacity: 0.5; box-shadow: 0 0 15px var(--accent); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .glitch-text { 
                font-size: 1.8rem; 
                letter-spacing: 6px; 
            }
            .hologram-container { 
                width: 200px; 
                height: 200px; 
            }
            .core-logo { 
                width: 65px; 
                height: 65px; 
            }
            .subtitle { 
                font-size: 0.8rem;
                letter-spacing: 2px;
            }
            .cyber-btn { 
                padding: 14px 30px; 
                font-size: 0.8rem; 
                letter-spacing: 2px; 
            }
            .boot-sequence { 
                display: none; 
            }
            .corner-deco {
                width: 40px; height: 40px;
            }
            .corner-tl { top: 20px; left: 20px; }
            .corner-tr { top: 20px; right: 20px; }
            .corner-bl { bottom: 20px; left: 20px; }
            .corner-br { bottom: 20px; right: 20px; }
        }
    </style>
</head>
<body class="crt">
    <div class="grid-floor"></div>
    <div class="data-particles" id="dataParticles"></div>

    <div class="boot-sequence" id="bootSequence"></div>

    <div class="corner-deco corner-tl"></div>
    <div class="corner-deco corner-tr"></div>
    <div class="corner-deco corner-bl"></div>
    <div class="corner-deco corner-br"></div>

    <div class="boot-screen">
        <div class="hologram-container">
            <div class="hologram-ring"></div>
            <div class="hologram-ring"></div>
            <div class="hologram-ring"></div>
            <div class="hologram-ring-inner"></div>
            <img src="assets/logo.jpg" alt="ZDL" class="core-logo">
        </div>

        <h1 class="glitch-text" data-text="ZHENG DIGITAL LAB">ZHENG DIGITAL LAB</h1>
        
        <div class="subtitle" id="subtitle">Initializing future digital solutions</div>

        <div class="button-group">
            <a href="https://wa.me/6288973745596" class="cyber-btn" target="_blank">
                <span class="icon">◈</span> CONNECT
            </a>
            <a href="home.html" class="cyber-btn primary">
                <span class="icon">▸</span> ENTER SYSTEM
            </a>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-item">
            <span class="status-dot"></span>
            <span>SYSTEM ONLINE</span>
        </div>
        <div class="status-item">
            <span>SECURE CONNECTION</span>
        </div>
        <div class="status-item">
            <span>V.2.0.4</span>
        </div>
    </div>

    <script>
        // Generate Elegant Particles
        const particlesContainer = document.getElementById('dataParticles');
        
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 8 + 10) + 's';
            particle.style.animationDelay = Math.random() * 10 + 's';
            particle.style.opacity = Math.random() * 0.4 + 0.2;
            particlesContainer.appendChild(particle);
        }

        // Boot Sequence Text
        const bootLines = [
            'SYSTEM BOOT SEQUENCE INITIATED',
            'LOADING NEURAL NETWORK MODULES',
            'ESTABLISHING SECURE CONNECTION',
            'AUTHENTICATION VERIFIED',
            'ACCESS GRANTED'
        ];
        
        const bootContainer = document.getElementById('bootSequence');
        bootLines.forEach((line, i) => {
            const div = document.createElement('div');
            div.className = 'boot-line';
            div.textContent = line;
            div.style.animationDelay = (i * 0.4) + 's';
            bootContainer.appendChild(div);
        });

        // Subtle typing effect for subtitle
        const subtitle = document.getElementById('subtitle');
        const text = subtitle.textContent;
        subtitle.textContent = '';
        let charIndex = 0;

        function typeChar() {
            if (charIndex < text.length) {
                subtitle.textContent += text.charAt(charIndex);
                charIndex++;
                setTimeout(typeChar, 50);
            }
        }

        setTimeout(typeChar, 2000);
    </script>
</body>
</html>
